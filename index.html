    <script type="text/babel">

      const WEB3FORMS_ACCESS_KEY = "de678f49-1da9-49d6-a333-038884128abf"; // <-- Paste your Web3Forms Access Key here to receive emails!
      const INSTAGRAM_URL = "https://instagram.com/adcenticstudio";

      // ----------------------------------------------------

      // ----------------------------------------------------
      const videos = [
        {
          title: "Product Campaign",
          category: "PRODUCT AD",
          local1: "./videos/product-campaign.mp4",
          local2: "./public/videos/product-campaign.mp4",
          fallback: "https://assets.mixkit.co/videos/preview/mixkit-fashion-woman-with-silver-makeup-40275-large.mp4"
        },
        {
          title: "Social Creative",
          category: "SOCIAL AD",
          local1: "./videos/social-ad.mp4",
          local2: "./public/videos/social-ad.mp4",
          fallback: "https://assets.mixkit.co/videos/preview/mixkit-holding-a-gold-credit-card-41566-large.mp4"
        },
        {
          title: "UGC Style",
          category: "UGC STYLE",
          local1: "./videos/ugc.mp4",
          local2: "./public/videos/ugc.mp4",
          fallback: "https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-smartphone-with-a-blue-screen-41603-large.mp4"
        },
        {
          title: "Creative Concept",
          category: "CONCEPT",
          local1: "./videos/creative-concept.mp4",
          local2: "./public/videos/creative-concept.mp4",
          fallback: "https://assets.mixkit.co/videos/preview/mixkit-rotating-smartphone-with-a-green-screen-41605-large.mp4"
        }
      ];

      const heroVideo = {
        local1: "./videos/vid5.mp4",
        local2: "./public/videos/vid5.mp4",
        fallback: "https://assets.mixkit.co/videos/preview/mixkit-fashion-woman-with-silver-makeup-40275-large.mp4"
      };

      // ----------------------------------------------------
      // CUSTOM FAIL-SAFE VIDEO PLAYER COMPONENT
      // ----------------------------------------------------
      const VideoPlayer = ({ srcList, fallback, poster, className = '', autoplay = true, muted = true, loop = true, playsInline = true, label, aspectRatio = 'aspect-video' }) => {
        const videoRef = useRef(null);
        const [isPlaying, setIsPlaying] = useState(autoplay);
        const [isMuted, setIsMuted] = useState(muted);
        const [srcIndex, setSrcIndex] = useState(0);
        const [currentSrc, setCurrentSrc] = useState(srcList[0]);

        useEffect(() => {
          if (videoRef.current) {
            if (autoplay) {
              videoRef.current.play().catch(() => setIsPlaying(false));
            } else {
              videoRef.current.pause();
              setIsPlaying(false);
            }
          }
        }, [autoplay]);

        const togglePlay = (e) => {
          e.stopPropagation();
          if (videoRef.current) {
            if (isPlaying) {
              videoRef.current.pause();
            } else {
              videoRef.current.play().catch(() => {});
            }
            setIsPlaying(!isPlaying);
          }
        };

        const toggleMute = (e) => {
          e.stopPropagation();
          if (videoRef.current) {
            videoRef.current.muted = !isMuted;
            setIsMuted(!isMuted);
          }
        };

        const handleFullscreen = (e) => {
          e.stopPropagation();
          if (videoRef.current && videoRef.current.requestFullscreen) {
            videoRef.current.requestFullscreen();
          }
        };

        const handleVideoError = () => {
          // If the first local path fails, try the second local path. If that fails too, load the fallback.
          if (srcIndex < srcList.length - 1) {
            const nextIdx = srcIndex + 1;
            setSrcIndex(nextIdx);
            setCurrentSrc(srcList[nextIdx]);
          } else if (srcIndex === srcList.length - 1 && currentSrc !== fallback) {
            console.warn("Local video sources failed, switching to CDN fallback.");
            setCurrentSrc(fallback);
          }
        };

        return (
          <div 
            onClick={togglePlay}
            className={`relative overflow-hidden bg-black/40 border border-white/10 rounded-lg group cursor-pointer ${aspectRatio} ${className}`}
          >
            {label && (
              <div className="absolute top-4 left-4 z-10 px-3 py-1 bg-black/70 backdrop-blur-md border border-white/10 rounded-full text-[10px] tracking-widest text-white/80 uppercase font-medium">
                {label}
              </div>
            )}
            
            <video
              ref={videoRef}
              src={currentSrc}
              poster={poster}
              autoPlay={autoplay}
              muted={isMuted}
              loop={loop}
              playsInline={playsInline}
              onError={handleVideoError}
              className="w-full h-full object-cover"
            />

            {/* Middle Play/Pause Indicator (Only shows when paused) */}
            <div className="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
              {!isPlaying && (
                <div className="p-4 bg-white/10 rounded-full text-white backdrop-blur-md scale-90 opacity-85 group-hover:scale-100 transition-all duration-300">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="ml-1"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </div>
              )}
            </div>

            {/* Hover overlay controls */}
            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4 z-20">
              <div className="flex items-center justify-between">
                <div className="flex gap-2">
                  <button 
                    onClick={toggleMute}
                    className="p-2 bg-white/10 hover:bg-white/20 rounded-full text-white backdrop-blur-sm transition-colors cursor-pointer"
                    aria-label={isMuted ? "Unmute" : "Mute"}
                  >
                    {isMuted ? (
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                    ) : (
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    )}
                  </button>
                </div>
                <button 
                  onClick={handleFullscreen}
                  className="p-2 bg-white/10 hover:bg-white/20 rounded-full text-white backdrop-blur-sm transition-colors cursor-pointer"
                  aria-label="Fullscreen"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ----------------------------------------------------
      // MAIN APP COMPONENT
      // ----------------------------------------------------
      function App() {
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
        const [testimonialIndex, setTestimonialIndex] = useState(0);
        const [isTestimonialHovered, setIsTestimonialHovered] = useState(false);
        
        // Form state
        const [formState, setFormState] = useState({
          name: '',
          brand: '',
          email: '',
          website: '',
          service: 'AI Video Ads',
          message: ''
        });
        const [formSubmitted, setFormSubmitted] = useState(false);
        const [formLoading, setFormLoading] = useState(false);

        // Testimonials
        const testimonials = [
          {
            quote: "The creative quality was much better than what we were producing in-house. The ads felt fresh and actually looked like our brand.",
            client: "Arjun Mehta",
            brand: "D2C Founder"
          },
          {
            quote: "What I liked most was how quickly they turned a simple product idea into something that felt like a real campaign.",
            client: "Priya Nair",
            brand: "Brand Founder"
          },
          {
            quote: "Adcentic understood the visual direction we wanted without making everything feel overly polished or artificial. Really happy with the work.",
            client: "Rohan Kapoor",
            brand: "E-commerce Founder"
          },
          {
            quote: "They brought a completely different perspective to our advertising. The concepts were creative, clear, and made our products look premium.",
            client: "Daniel Brooks",
            brand: "Brand Owner"
          },
          {
            quote: "The process was simple from start to finish. We gave them the product and direction, and they came back with creatives we could actually use.",
            client: "Sophie Martin",
            brand: "E-commerce Founder"
          }
        ];

        // Autoplay testimonials
        useEffect(() => {
          if (isTestimonialHovered) return;
          const interval = setInterval(() => {
            setTestimonialIndex((prev) => (prev + 1) % testimonials.length);
          }, 6000);
          return () => clearInterval(interval);
        }, [isTestimonialHovered]);

        const handleFormChange = (e) => {
          setFormState({
            ...formState,
            [e.target.name]: e.target.value
          });
        };

        const handleFormSubmit = async (e) => {
          e.preventDefault();
          setFormLoading(true);

          if (WEB3FORMS_ACCESS_KEY === "YOUR_ACCESS_KEY_HERE" || !WEB3FORMS_ACCESS_KEY) {
            // Local fallback simulation if key is not configured yet
            console.warn("Web3Forms access key is not set. Simulating form submission.");
            setTimeout(() => {
              setFormLoading(false);
              setFormSubmitted(true);
            }, 1200);
            return;
          }

          try {
            const response = await fetch("https://api.web3forms.com/submit", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({
                access_key: WEB3FORMS_ACCESS_KEY,
                name: formState.name,
                brand: formState.brand,
                email: formState.email,
                website: formState.website,
                service: formState.service,
                message: formState.message,
              }),
            });

            const result = await response.json();
            if (result.success) {
              setFormSubmitted(true);
            } else {
              alert("Submission failed. Please contact us directly at " + EMAIL_ADDRESS);
            }
          } catch (error) {
            console.error("Error submitting form:", error);
            alert("Something went wrong. Please email us directly at " + EMAIL_ADDRESS);
          } finally {
            setFormLoading(false);
          }
        };

        return (
          <div className="min-h-screen bg-[#080808] text-white overflow-x-hidden">
            
            {/* 1. Sticky Navigation */}
            <nav className="fixed top-0 left-0 w-full z-50 border-b border-white/5 bg-[#080808]/85 backdrop-blur-md">

                <a href="#" className="text-lg font-bold tracking-widest text-white hover:text-white/80 transition-colors uppercase">
                  ADCENTIC STUDIO
                </a>

                {/* Desktop Nav Links */}
                <div className="hidden md:flex items-center gap-10">
                  <a href="#work" className="text-xs font-semibold text-[#A1A1A1] hover:text-white transition-colors uppercase tracking-wider">WORK</a>
                  <a href="#services" className="text-xs font-semibold text-[#A1A1A1] hover:text-white transition-colors uppercase tracking-wider">SERVICES</a>
                  <a href="#about" className="text-xs font-semibold text-[#A1A1A1] hover:text-white transition-colors uppercase tracking-wider">ABOUT</a>
                  <a href="#contact" className="text-xs font-semibold text-[#A1A1A1] hover:text-white transition-colors uppercase tracking-wider">CONTACT</a>
                </div>

                {/* Desktop CTA */}
                <a 
                  href="#contact" 
                  className="hidden md:flex items-center gap-1 px-5 py-2.5 bg-white text-black hover:bg-[#2563FF] hover:text-white transition-all duration-300 font-bold text-xs tracking-wider rounded-md uppercase"
                >
                  START A PROJECT 
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                </a>

                {/* Mobile Hamburger menu */}
                <button 
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="md:hidden p-2 text-white hover:text-[#A1A1A1] transition-colors cursor-pointer"
                  aria-label="Toggle Navigation"
                >
                  {mobileMenuOpen ? (

                  <p className="text-lg md:text-xl text-[#A1A1A1] font-light max-w-xl mb-10 leading-relaxed">
                    AI-powered advertising creatives built to make D2C brands stand out.
                  </p>
                  <div className="flex flex-col sm:flex-row gap-4">
                    <a

                      className="flex items-center justify-center gap-2 px-8 py-4 bg-white text-black hover:bg-white/90 font-bold tracking-wide rounded-md transition-all duration-300 cursor-pointer text-sm"
                    >
                      VIEW OUR WORK 
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="7" x2="17" y2="17"></line><polyline points="17 7 17 17 7 17"></polyline></svg>
                    </a>
                    <a 
                      href="#contact"
                      className="flex items-center justify-center gap-2 px-8 py-4 bg-[#080808] text-white border border-white/20 hover:border-white hover:bg-white/5 font-bold tracking-wide rounded-md transition-all duration-300 cursor-pointer text-sm"
                    >

                {/* Hero Showcase Video */}
                <div className="lg:col-span-5 relative w-full">

            {/* 4. Services Section (Clean and Static) */}

                      num: "04",
                      title: "DELIVER",
                      desc: "You receive polished creatives ready for social and advertising."
                    }
                  ].map((step, idx) => (
                    <div key={idx} className="flex flex-col gap-4 border-l border-white/10 pl-6">
                      <span className="text-5xl font-extrabold text-[#2563FF]/80 leading-none">
                        {step.num}
                      </span>
                      <h3 className="text-lg font-bold tracking-wider uppercase mt-2">
                        {step.title}
                      </h3>
                      <p className="text-sm text-[#A1A1A1] font-light leading-relaxed">
                        {step.desc}
                      </p>
                    </div>
                  ))}
                </div>

              </div>
            </section>

            {/* 6. Why Adcentic */}
            <section className="py-24 border-t border-white/5">
              <div className="max-w-7xl mx-auto px-6">
                
                <div className="mb-16">
                  <span className="text-xs font-bold tracking-widest text-[#2563FF] uppercase mb-3 block">
                    DIFFERENTIATOR
                  </span>
                  <h2 className="text-3xl md:text-5xl font-bold tracking-tight">
                    WHY ADCENTIC
                  </h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  {[
                    {
                      title: "FASTER",
                      desc: "Explore more creative directions without traditional production limitations."
                    },
                    {
                      title: "MORE CREATIVE",
                      desc: "Build advertising concepts that go beyond standard product photography."
                    },
                    {
                      title: "BUILT FOR ADS",
                      desc: "Every creative is developed with attention, audience and advertising in mind."
                    }
                  ].map((item, idx) => (
                    <div key={idx} className="p-8 bg-white/[0.01] border border-white/5 rounded-lg flex flex-col gap-4">
                      <h3 className="text-lg font-bold tracking-widest uppercase text-white">
                        {item.title}
                      </h3>
                      <p className="text-[#A1A1A1] font-light leading-relaxed text-sm">
                        {item.desc}
                      </p>
                    </div>
                  ))}
                </div>

              </div>
            </section>

            {/* 7. Testimonials */}
            <section className="py-24 border-t border-white/5 bg-[#0a0a0a]">
              <div className="max-w-7xl mx-auto px-6">
                
                <div className="flex flex-col md:flex-row md:items-end justify-between mb-12">
                  <div>
                    <span className="text-xs font-bold tracking-widest text-[#A1A1A1] uppercase mb-3 block">
                      FEEDBACK
                    </span>
                    <h2 className="text-3xl md:text-5xl font-bold tracking-tight">
                      WHAT BRANDS SAY
                    </h2>
                  </div>
                  
                  {/* Testimonial Nav */}
                  <div className="flex items-center gap-3 mt-6 md:mt-0">
                    <button 
                      onClick={() => setTestimonialIndex((prev) => (prev === 0 ? testimonials.length - 1 : prev - 1))}
                      className="p-3 bg-white/5 border border-white/10 hover:bg-white/10 rounded-full text-white cursor-pointer transition-colors"
                      aria-label="Previous testimonial"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </button>
                    <button 
                      onClick={() => setTestimonialIndex((prev) => (prev + 1) % testimonials.length)}
                      className="p-3 bg-white/5 border border-white/10 hover:bg-white/10 rounded-full text-white cursor-pointer transition-colors"
                      aria-label="Next testimonial"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                  </div>
                </div>

                {/* Slideshow Display */}
                <div 
                  className="relative min-h-[250px] flex items-center justify-center border border-white/5 bg-white/[0.01] rounded-xl p-8 md:p-16"
                  onMouseEnter={() => setIsTestimonialHovered(true)}
                  onMouseLeave={() => setIsTestimonialHovered(false)}
                >
                  <span className="absolute top-6 left-8 text-7xl font-serif text-white/5 select-none">“</span>
                  
                  <div className="w-full max-w-3xl text-center">
                    <div className="flex flex-col gap-6 transition-all duration-300">
                      <p className="text-xl md:text-2xl font-light italic leading-relaxed text-white/95">
                        "{testimonials[testimonialIndex].quote}"
                      </p>
                      
                      <div>
                        <h4 className="text-sm font-bold tracking-widest text-[#2563FF] uppercase">
                          — {testimonials[testimonialIndex].client}
                        </h4>
                        <p className="text-xs text-[#A1A1A1] tracking-wider uppercase mt-1">
                          {testimonials[testimonialIndex].brand}
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Indicators */}
                  <div className="absolute bottom-6 flex gap-2">
                    {testimonials.map((_, idx) => (
                      <button
                        key={idx}
                        onClick={() => setTestimonialIndex(idx)}
                        className={`w-2 h-2 rounded-full transition-all duration-300 cursor-pointer ${
                          testimonialIndex === idx ? 'bg-[#2563FF] w-6' : 'bg-white/20'
                        }`}
                        aria-label={`Go to testimonial ${idx + 1}`}
                      />
                    ))}
                  </div>
                </div>

              </div>
            </section>

            {/* 8. About Section */}
            <section id="about" className="py-24 border-t border-white/5">
              <div className="max-w-4xl mx-auto px-6 text-center flex flex-col items-center justify-center">
                <span className="text-xs font-bold tracking-[0.2em] text-[#2563FF] uppercase mb-4">
                  ABOUT ADCENTIC
                </span>
                <h2 className="text-3xl md:text-5xl font-bold tracking-tight mb-8">
                  CREATIVE, WITHOUT <br />THE OLD LIMITS.
                </h2>
                <p className="text-lg md:text-xl text-[#A1A1A1] font-light leading-relaxed max-w-2xl mb-6">
                  Adcentic Studio is an AI-first advertising creative studio helping D2C brands turn products into attention-grabbing advertising.
                </p>
                <p className="text-base text-[#A1A1A1] font-light leading-relaxed max-w-2xl">
                  We combine creative direction, AI-assisted production and advertising thinking to create more concepts, faster.
                </p>
              </div>
            </section>

            {/* 9. Final CTA */}
            <section className="py-24 border-t border-white/5 bg-[#0a0a0a]">
              <div className="max-w-7xl mx-auto px-6 text-center flex flex-col items-center justify-center">
                <h2 className="text-4xl md:text-6xl font-extrabold tracking-tight mb-6 max-w-3xl leading-tight">
                  HAVE A PRODUCT WORTH <br />STOPPING FOR?
                </h2>
                <p className="text-lg text-[#A1A1A1] font-light max-w-xl mb-10">
                  Let's turn it into an ad people remember.
                </p>
                <div className="flex flex-col sm:flex-row gap-4">
                  <a 
                    href="#contact"
                    className="flex items-center justify-center gap-2 px-8 py-4 bg-white text-black hover:bg-[#2563FF] hover:text-white font-bold tracking-wide rounded-md transition-all duration-300 cursor-pointer uppercase text-xs"
                  >
                    START A PROJECT 
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                  </a>
                  <a 
                    href={INSTAGRAM_URL}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex items-center justify-center gap-2 px-8 py-4 bg-transparent text-white border border-white/10 hover:border-white font-bold tracking-wide rounded-md transition-all duration-300 cursor-pointer uppercase text-xs"
                  >
                    INSTAGRAM 
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                  </a>
                </div>
              </div>
            </section>

            {/* 10. Contact Section */}
            <section id="contact" className="py-24 border-t border-white/5 relative">
              <div className="max-w-3xl mx-auto px-6">
                
                <div className="text-center mb-16">
                  <span className="text-xs font-bold tracking-widest text-[#2563FF] uppercase mb-3 block">
                    GET IN TOUCH
                  </span>
                  <h2 className="text-3xl md:text-5xl font-bold tracking-tight">
                    START A PROJECT
                  </h2>
                </div>

                <div className="bg-white/[0.01] border border-white/5 rounded-xl p-8 md:p-12">
                  {formSubmitted ? (
                    <div className="flex flex-col items-center justify-center text-center py-12">
                      <div className="p-4 bg-[#2563FF]/10 text-[#2563FF] rounded-full mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                      </div>
                      <h3 className="text-2xl font-bold mb-3">INQUIRY SENT</h3>
                      <p className="text-[#A1A1A1] max-w-md">
                        Thank you for reaching out. We will review your product and get back to you within 24 hours.
                      </p>
                    </div>
                  ) : (
                    <form onSubmit={handleFormSubmit} className="flex flex-col gap-6">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="flex flex-col gap-2">
                          <label htmlFor="name" className="text-xs font-bold tracking-wider text-[#A1A1A1] uppercase">NAME</label>
                          <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            required
                            value={formState.name}
                            onChange={handleFormChange}
                            className="bg-black/40 border border-white/10 rounded-md px-4 py-3 text-sm focus:border-[#2563FF] focus:outline-none transition-colors"
                            placeholder="Your Name"
                          />
                        </div>
                        <div className="flex flex-col gap-2">
                          <label htmlFor="brand" className="text-xs font-bold tracking-wider text-[#A1A1A1] uppercase">BRAND</label>
                          <input 
                            type="text" 
                            id="brand" 
                            name="brand" 
                            required
                            value={formState.brand}
                            onChange={handleFormChange}
                            className="bg-black/40 border border-white/10 rounded-md px-4 py-3 text-sm focus:border-[#2563FF] focus:outline-none transition-colors"
                            placeholder="Your Brand Name"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="flex flex-col gap-2">
                          <label htmlFor="email" className="text-xs font-bold tracking-wider text-[#A1A1A1] uppercase">EMAIL</label>
                          <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required
                            value={formState.email}
                            onChange={handleFormChange}
                            className="bg-black/40 border border-white/10 rounded-md px-4 py-3 text-sm focus:border-[#2563FF] focus:outline-none transition-colors"
                            placeholder="name@email.com"
                          />
                        </div>
                        <div className="flex flex-col gap-2">
                          <label htmlFor="website" className="text-xs font-bold tracking-wider text-[#A1A1A1] uppercase">WEBSITE / INSTAGRAM</label>
                          <input 
                            type="text" 
                            id="website" 
                            name="website" 
                            value={formState.website}
                            onChange={handleFormChange}
                            className="bg-black/40 border border-white/10 rounded-md px-4 py-3 text-sm focus:border-[#2563FF] focus:outline-none transition-colors"
                            placeholder="yourbrand.com / @yourbrand"
                          />
                        </div>
                      </div>

                      <div className="flex flex-col gap-2">
                        <label htmlFor="service" className="text-xs font-bold tracking-wider text-[#A1A1A1] uppercase">WHAT DO YOU NEED?</label>
                        <select 
                          id="service" 
                          name="service"
                          value={formState.service}
                          onChange={handleFormChange}
                          className="bg-black border border-white/10 rounded-md px-4 py-3 text-sm focus:border-[#2563FF] focus:outline-none transition-colors cursor-pointer"
                        >
                          <option value="AI Video Ads">AI Video Ads</option>
                          <option value="Product Ads">Product Ads</option>
                          <option value="UGC-Style Ads">UGC-Style Ads</option>
                          <option value="Social Creative">Social Creative</option>
                          <option value="Creative Testing">Creative Testing</option>
                          <option value="Something Else">Something Else</option>
                        </select>
                      </div>

                      <div className="flex flex-col gap-2">
                        <label htmlFor="message" className="text-xs font-bold tracking-wider text-[#A1A1A1] uppercase">Tell us about your product</label>
                        <textarea 
                          id="message" 
                          name="message" 
                          rows="4"
                          required
                          value={formState.message}
                          onChange={handleFormChange}
                          className="bg-black/40 border border-white/10 rounded-md px-4 py-3 text-sm focus:border-[#2563FF] focus:outline-none transition-colors resize-none"
                          placeholder="Describe your product and advertising goals..."
                        />
                      </div>

                      <button 
                        type="submit" 
                        disabled={formLoading}
                        className="mt-2 w-full py-4 bg-white text-black hover:bg-[#2563FF] hover:text-white transition-all duration-300 font-bold uppercase tracking-wider text-xs rounded-md flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
                      >
                        {formLoading ? 'SENDING...' : 'SEND INQUIRY'} 
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                      </button>
                    </form>
                  )}
                </div>

              </div>
            </section>

            {/* 11. Footer */}
            <footer className="py-16 border-t border-white/5 bg-[#040404]">
              <div className="max-w-7xl mx-auto px-6">
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 mb-12">
                  
                  <div className="flex flex-col gap-4">
                    <h2 className="text-xl font-bold tracking-widest uppercase">ADCENTIC STUDIO</h2>
                    <p className="text-xs text-[#A1A1A1] tracking-wider uppercase font-light">
                      AI-powered advertising for D2C brands.
                    </p>
                  </div>

                  <div className="flex flex-col gap-4">
                    <h4 className="text-xs font-bold tracking-widest uppercase text-white">LINKS</h4>
                    <div className="flex flex-col gap-2">
                      <a href="#work" className="text-xs text-[#A1A1A1] hover:text-white transition-colors uppercase">WORK</a>
                      <a href="#services" className="text-xs text-[#A1A1A1] hover:text-white transition-colors uppercase">SERVICES</a>
                      <a href="#about" className="text-xs text-[#A1A1A1] hover:text-white transition-colors uppercase">ABOUT</a>
                      <a href="#contact" className="text-xs text-[#A1A1A1] hover:text-white transition-colors uppercase">CONTACT</a>
                    </div>
                  </div>

                  <div className="flex flex-col gap-4">
                    <h4 className="text-xs font-bold tracking-widest uppercase text-white">SOCIAL & CONTACT</h4>
                    <div className="flex flex-col gap-2">
                      <a 
                        href={INSTAGRAM_URL} 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        className="text-xs text-[#A1A1A1] hover:text-white transition-colors uppercase"
                      >
                        INSTAGRAM
                      </a>
                      <a 
                        href={`mailto:${EMAIL_ADDRESS}`} 
                        className="text-xs text-[#A1A1A1] hover:text-white transition-colors uppercase"
                      >
                        {EMAIL_ADDRESS}
                      </a>
                    </div>
                  </div>

                  <div className="flex flex-col gap-4">
                    <h4 className="text-xs font-bold tracking-widest uppercase text-white">LEGAL</h4>
                    <div className="flex flex-col gap-2">
                      <span className="text-xs text-[#A1A1A1]">© 2026 ADCENTIC STUDIO</span>
                    </div>
                  </div>

                </div>
              </div>
            </footer>

          </div>
        );
      }

      // Render the App
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
